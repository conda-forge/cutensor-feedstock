build_platform:
  linux_aarch64: linux_64
  win_arm64: win_arm64
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  win_arm64: default
test: native_and_emulated
workflow_settings:
  build_workspace_dir:
  - platform: win_64
    provider: azure
    value: C:\bld\
  free_disk_space:
  - provider: azure
    value: quick
  tools_install_dir:
  - platform: win_64
    provider: azure
    value: C:\Miniforge
